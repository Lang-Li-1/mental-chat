version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mental_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../../backend
      dockerfile: ../ops/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=dev-secret-key-change-me-in-production-environments
      - DJANGO_ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL_ORIGINS=True
      - AI_SERVICE_URL=http://ai_service:5000
      - DJANGO_SETTINGS_MODULE=config.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=mental_chat
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - ai_service
      - redis
      - postgres
    volumes:
      - ../../backend:/app
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application

  celery_worker:
    build:
      context: ../../backend
      dockerfile: ../ops/docker/Dockerfile.backend
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=dev-secret-key-change-me-in-production-environments
      - DJANGO_ALLOWED_HOSTS=*
      - AI_SERVICE_URL=http://ai_service:5000
      - DJANGO_SETTINGS_MODULE=config.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=mental_chat
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
      - postgres
    volumes:
      - ../../backend:/app
    command: celery -A config worker -l info

  ai_service:
    build:
      context: ../../ai_service
      dockerfile: ../ops/docker/Dockerfile.ai_service
    ports:
      - "5000:5000"
    environment:
      - AI_API_KEY=dev-api-key-change-me
    volumes:
      - ../../ai_service:/app
    command: python app.py


volumes:
  postgres_data:
