version: "3.8"

services:
  backend:
    build:
      context: ../../backend
      dockerfile: ../ops/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - AI_SERVICE_URL=http://ai_service:5000
      - DJANGO_SETTINGS_MODULE=config.settings
    depends_on:
      - ai_service
    volumes:
      - ../../backend:/app
    command: python manage.py runserver 0.0.0.0:8000

  ai_service:
    build:
      context: ../../ai_service
      dockerfile: ../ops/docker/Dockerfile.ai_service
    ports:
      - "5000:5000"
    volumes:
      - ../../ai_service:/app
    command: python app.py
